# Continuous integration: the same gates README "Contributing" asks for
# (ruff, mypy, pytest), the strict docs build, and the TraceSig contract test
# that pins the prevention/detection pairing end to end.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src/agent_policy_gateway

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,docs]"
      - run: python -m pytest

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[docs]"
      - run: python -m mkdocs build --strict

  tracesig-contract:
    name: TraceSig contract (APG export -> TraceSig rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      # TraceSig 0.2.0, pinned by commit.
      - run: python -m pip install -e ".[dev]" "tracesig @ git+https://github.com/howardhsieh/tracesig@f9b498521b583eb153ece19f08b0af31c8b52be0"
      - run: python -m pytest tests/test_tracesig_contract.py -o addopts="" -v
      - name: Scan the committed example exports with TraceSig
        run: |
          tracesig scan examples/traces/benign-session.tracesig.jsonl --fail-on low
          set +e
          tracesig scan examples/traces/denied-injection.tracesig.jsonl --fail-on critical
          code=$?
          set -e
          test "$code" -eq 2
