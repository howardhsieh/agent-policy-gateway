name: Bug report
description: The gateway, a policy feature, an adapter or the CLI misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A policy **bypass** (a call allowed that should be denied) is a vulnerability: please report it privately, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: "`pip show agent-policy-gateway` or a commit hash"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal policy and calls to reproduce
      render: yaml
  - type: input
    id: env
    attributes:
      label: OS, Python version, adapter (MCP / OpenAI / Anthropic / LangChain / AgentDojo)
