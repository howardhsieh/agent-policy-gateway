# Create the GitHub release (and its v<version> tag) for the version in
# pyproject.toml, with notes from CHANGELOG.md. Runs when the version changes
# on main, or by hand. PyPI publishing stays in publish.yml (trusted
# publishing); a tag created here with the Actions token does not trigger it.

name: GitHub release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    name: Create the release if it is missing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Version and release notes
        id: v
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(version), text, re.S | re.M)
          section = m.group(1).strip() if m else ""
          intro = section.split("\n### ", 1)[0].strip()
          bullets = re.findall(r"^- .*$", section, re.M)[:3]
          notes = "\n\n".join(p for p in [intro, "\n".join(bullets)] if p)
          notes += (
              "\n\n```bash\npip install agent-policy-gateway==%s\n```\n\n"
              "Full notes: [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md)\n"
              % (version, os.environ["GITHUB_REPOSITORY"])
          )
          open("NOTES.md", "w", encoding="utf-8").write(notes)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("version=%s\n" % version)
          PY
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$VERSION" >/dev/null; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$VERSION" --notes-file NOTES.md
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file NOTES.md
          fi
