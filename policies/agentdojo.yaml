version: 1
name: agentdojo-baseline
description: |
  Baseline defense for the AgentDojo benchmark suites (R49b). One deny rule
  per external sink in the cross-suite union (banking, slack, travel,
  workspace of benchmark v1.2.1), each firing only when the call's input
  label carries the agentdojo:untrusted source — i.e. after the session has
  read content an attacker can author (files, transaction subjects,
  webpages, reviews, emails, calendar bodies; see
  agent_policy_gateway.agentdojo_suite). Untainted calls match no rule and
  fall through to the gateway's default-allow, so benign episodes that
  never touch untrusted content keep full utility. The sink list is kept in
  lockstep with agentdojo_suite._EXTERNAL_SINKS by the test suite.
rules:
  # ---- banking -----------------------------------------------------------
  - id: deny-untrusted-to-send_money
    when:
      tool: send_money
      taint:
        any_of: [agentdojo:untrusted]
    effect:
      action: deny
      reason: Untrusted AgentDojo content may not drive send_money.
  - id: deny-untrusted-to-schedule_transaction
    when:
      tool: schedule_transaction
      taint:
        any_of: [agentdojo:untrusted]
    effect:
      action: deny
      reason: Untrusted AgentDojo content may not drive schedule_transaction.
  - id: deny-untrusted-to-update_scheduled_transaction
