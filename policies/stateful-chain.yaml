version: 1
name: stateful-chain
description: |
  Chain-history defense for the R55 long-horizon harness — the same sinks
  and the same declassify grant as policies/stateful-input-taint.yaml, but
  each sink rule is stated over the session *call history* (R53), not the
  current input label. A sink is denied once any executed call in the
  session has returned eval:untrusted content, whatever the current label
  now says.

  The declassify grant is kept identical to the input-taint policy on
  purpose: a mid-session sanitize still strips the live label (so a
  declassify-aware rule would be fooled), but the history entry recording
  the earlier untrusted read is immutable. The chain rule therefore holds
  across the whole horizon where the input-taint rule is laundered — the
  robustness R53's design note promised and the R55 benchmark quantifies.
declassify:
  - id: sanitize-strips-untrusted
    description: A vetted sanitize step clears the untrusted session label.
    tool: sanitize
    sources: ["eval:untrusted"]
rules:
  - id: deny-send_money-after-untrusted-read
    when:
      tool: send_money
      chain:
        any_prior:
          - source: "eval:untrusted"
            verdict: allow
    effect:
      action: deny
      reason: A send_money after an untrusted read may act on laundered content.
  - id: deny-send_email-after-untrusted-read
    when:
      tool: send_email
      chain:
        any_prior:
          - source: "eval:untrusted"
            verdict: allow
    effect:
      action: deny
      reason: A send_email after an untrusted read may act on laundered content.
  - id: deny-post_webpage-after-untrusted-read
    when:
      tool: post_webpage
      chain:
        any_prior:
          - source: "eval:untrusted"
            verdict: allow
    effect:
      action: deny
      reason: A post_webpage after an untrusted read may exfiltrate laundered content.
